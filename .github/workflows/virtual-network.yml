name: SSCP transfer curves and network sweep
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      profile:
        description: Network sweep profile
        type: choice
        default: scenarios
        options: [quick, broad, large, stress, scenarios, scenarios-1g, shallow-stress]
      cc:
        description: Congestion control algorithm(s)
        type: choice
        default: both
        options: [both, aimd, cubic, prob, all]
permissions:
  contents: read
  actions: read
jobs:
  transfers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S test -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: Integrity and functional checks
        run: ctest --test-dir build --output-on-failure
      - name: AddressSanitizer virtual integrity checks
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          cmake -S test -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
          cmake --build build-asan -j2
          ctest --test-dir build-asan -L virtual --output-on-failure
      - name: Virtual network 1 GiB transfer (AIMD & CUBIC)
        run: |
          python3 test/run.py build/sscp_virtual --backend virtual --mode aimd --bytes 1073741824 --mbps 1000 --out results/transfers/virtual-1g-aimd
          python3 test/run.py build/sscp_virtual --backend virtual --mode cubic --bytes 1073741824 --mbps 1000 --out results/transfers/virtual-1g-cubic
      - name: Linux UDP file transfer 1 GiB (AIMD & CUBIC)
        run: |
          python3 test/run.py build/sscp_udp --file-test --mode aimd --bytes 1073741824 --out results/transfers/linux-udp-1g-aimd
          python3 test/run.py build/sscp_udp --file-test --mode cubic --bytes 1073741824 --out results/transfers/linux-udp-1g-cubic
      - name: Publish transfer results
        if: always()
        run: |
          for report in results/transfers/*/report.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-1g-results
          path: |
            results/transfers/
            !results/transfers/**/*.bin
            !results/transfers/**/*.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: transfer-1g-logs
          path: results/transfers/**/*.log
          retention-days: 14
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S test -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: Sweep configured network environments
        env:
          PROFILE: ${{ inputs.profile || 'scenarios' }}
          CC: ${{ inputs.cc || 'both' }}
        run: python3 test/virtual/sweep.py build/sscp_virtual --config test/virtual/network_sweep.json --profile "$PROFILE" --cc "$CC" --shard-index ${{ matrix.shard }} --shard-count 8 --jobs 2 --out results/shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-shard-${{ matrix.shard }}
          path: |
            results/**/*.json
            results/**/*.csv
            results/**/*.md
            results/**/failure.log
          retention-days: 14
  report:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: network-shard-*
          merge-multiple: true
          path: results
      - name: Download previous main sweep baseline for regression diff
        env:
          GH_TOKEN: ${{ github.token }}
          CUR_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p prev-baseline
          PREV_INFO=$(gh run list --workflow virtual-network.yml --branch main --status completed --limit 15 --json databaseId,headSha,conclusion --jq ".[] | select(.databaseId != $CUR_RUN_ID and (.conclusion == \"success\" or .conclusion == \"failure\")) | \"\(.databaseId) \(.headSha[0:7])\"" | head -n 1 || true)
          if [ -n "$PREV_INFO" ]; then
            PREV_ID=$(echo "$PREV_INFO" | awk '{print $1}')
            PREV_SHA=$(echo "$PREV_INFO" | awk '{print $2}')
            if gh run download "$PREV_ID" -n network-report -D prev-baseline 2>/dev/null && [ -f prev-baseline/sweep.csv ]; then
              echo "BASELINE_ARGS=--baseline prev-baseline/sweep.csv --baseline-label commit-$PREV_SHA(run-$PREV_ID)" >> "$GITHUB_ENV"
            fi
          fi
      - name: Merge shards and compute regression report
        run: python3 test/virtual/sweep.py --merge results $BASELINE_ARGS
      - uses: actions/upload-artifact@v4
        id: figures
        if: always()
        with:
          name: network-report
          path: |
            results/report.md
            results/sweep.csv
          retention-days: 14
      - name: Publish network diagnosis
        if: always()
        env:
          REPORT_URL: ${{ steps.figures.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          report = pathlib.Path('results/report.md')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Network sweep report\n\n[Download sweep report and CSV](' + os.environ['REPORT_URL'] + ')\n\n')
              if report.exists():
                  output.write(report.read_text())
              else:
                  output.write('FAIL: merged report was not produced; inspect shard jobs.\n')
          PY
